<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | Ridgeline Lawn &amp; Landscape</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#1E3B2C;--ink:#EEF3EA;--soft:#B9C8BC;--gold:#E0A91E;--gold-ink:#1B1606}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6;padding:40px 20px}
main{max-width:34rem}
.label{font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
h1{font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-weight:900;font-stretch:112%;font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:12px 0 16px}
p{color:var(--soft);margin:0 0 14px}
a.btn{display:inline-block;margin-top:14px;background:var(--gold);color:var(--gold-ink);font-family:"Archivo",Arial,sans-serif;font-weight:800;padding:12px 20px;border-radius:6px;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="label">Request received</p>
  <h1>Thanks. We'll be in touch within a day.</h1>
  <p>Your quote request is on its way to Ridgeline. Expect a call or text from (814) 555-0142.</p>
  <p>This is a demo site for a fictional company, so no one will actually call.</p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
